[uwsgi]
# uWSGI 生产环境配置（可选，非默认）
module = app:app
master = true
processes = 2
threads = 2
# 使用内置 HTTP 服务，避免额外部署 nginx；如需 nginx 反向代理可改为 socket 模式
http = 0.0.0.0:5000
# 若通过 nginx 反向代理，请改为以下两行：
# socket = 0.0.0.0:5000
# chmod-socket = 666

# 安全与性能
vacuum = true
die-on-term = true
enable-threads = true
harakiri = 60
buffer-size = 65535

# 日志
logto = logs/uwsgi.log
