services:
  zfjw-backend:
    build: .
    container_name: zfjw-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      # 微信小程序凭据通过项目根目录的 .env 注入（不会被提交到 Git）
      - APPID=${APPID}
      - APPSECRET=${APPSECRET}
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      # 若要持久化学生绑定数据，请取消下一行注释（自行保证目录权限）
      # - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      # alpine 镜像不含 curl，用镜像自带的 python 做健康检查
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 可选：添加nginx反向代理
